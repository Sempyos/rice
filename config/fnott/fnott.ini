max-width=768
max-height=256

dpi-aware=true

max-icon-size=80

edge-margin-vertical=16
edge-margin-horizontal=16

notification-margin=16

selection-helper=fuzzel --dmenu0
selection-helper-uses-null-separator=true

padding-vertical=20
padding-horizontal=32

border-radius=128
border-size=0

body-font=Roboto

title-font=GoogleSansFlex:weight=bold:size=6
title-format=%a // %s

summary-format=
summary-font=GoogleSansFlex

body-font=GoogleSansFlex:size=6

# icon=/home/semper/Downloads/mctil2j7ukh1yqpgjd9c.jpg

scaling-filter=bilinear

[low]
default-timeout=5

background=15121cff
title-color=e7e0efff
body-color=e7e0efff

[normal]
default-timeout=8

background=15121cff
title-color=e7e0efff
body-color=e7e0efff

[critical]
default-timeout=0
title-format=<u>%a // %s<u>

background=15121cff
title-color=e7e0efff
body-color=e7e0efff

