[main]
# font=AnnotationMono:fontfeatures=onum
font=GoogleSansCodenf
dpi-aware=true
resize-by-cells=false
pad=5x5 center

[scrollback]
indicator-position=none

[csd]
size=41
color={{colors.surface.default.hex_stripped}}
button-color={{colors.on_surface.default.hex_stripped}}
button-maximize-color={{colors.primary.default.hex_stripped}}
button-close-color={{colors.primary.default.hex_stripped}}
button-width=40

[cursor]
style=beam

[touch]
long-press-delay=200

[colors-dark]

# Cursor (this is fine, just keep good contrast)
cursor={{colors.on_tertiary.default.hex_stripped}} {{colors.tertiary.default.hex_stripped}}

# Core
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}

# Regular ANSI
regular0={{colors.surface_variant.default.hex_stripped}}   # black
regular1={{colors.error.default.hex_stripped}}             # red
regular2={{colors.primary.default.hex_stripped}}           # green (main accent)
regular3={{colors.tertiary.default.hex_stripped}}          # yellow-ish
regular4={{colors.secondary.default.hex_stripped}}         # blue
regular5={{colors.tertiary.default.hex_stripped}}          # magenta fallback
regular6={{colors.secondary.default.hex_stripped}}         # cyan fallback
regular7={{colors.on_surface.default.hex_stripped}}        # white

# Bright ANSI
bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.error_container.default.hex_stripped}}
bright2={{colors.primary_container.default.hex_stripped}}
bright3={{colors.tertiary_container.default.hex_stripped}}
bright4={{colors.secondary_container.default.hex_stripped}}
bright5={{colors.tertiary_container.default.hex_stripped}}
bright6={{colors.secondary_container.default.hex_stripped}}
bright7={{colors.on_surface.default.hex_stripped}}
