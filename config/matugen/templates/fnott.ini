max-width=768
max-height=256

dpi-aware=true

max-icon-size=80

edge-margin-vertical=16
edge-margin-horizontal=16

notification-margin=16

selection-helper=fuzzel --dmenu0
selection-helper-uses-null-separator=true

padding-vertical=20
padding-horizontal=32

border-radius=128
border-size=0

body-font=Roboto

title-font=GoogleSansFlex:weight=bold:size=6
title-format=%a // %s

summary-format=
summary-font=GoogleSansFlex

body-font=GoogleSansFlex:size=6

icon={{image}}

scaling-filter=bilinear

[low]
default-timeout=5

background={{colors.surface.default.hex_stripped}}ff
title-color={{colors.on_surface.default.hex_stripped}}ff
body-color={{colors.on_surface.default.hex_stripped}}ff

[normal]
default-timeout=8

background={{colors.surface.default.hex_stripped}}ff
title-color={{colors.on_surface.default.hex_stripped}}ff
body-color={{colors.on_surface.default.hex_stripped}}ff

[critical]
default-timeout=0
title-format=<u>%a // %s<u>

background={{colors.surface.default.hex_stripped}}ff
title-color={{colors.on_surface.default.hex_stripped}}ff
body-color={{colors.on_surface.default.hex_stripped}}ff

