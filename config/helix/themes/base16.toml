"ui.background" = { bg = "#ff7aac" }
"ui.virtual.whitespace" = "base03"
"ui.virtual.jump-label" = { fg = "blue", modifiers = ["bold", "underlined"] }
"ui.virtual.ruler" = { bg = "base01" }
"ui.menu" = { fg = "base05", bg = "base01" }
"ui.menu.selected" = { fg = "base01", bg = "base04" }
"ui.linenr" = { fg = "base03", bg = "base01" }
"ui.popup" = { bg = "base01" }
"ui.window" = { bg = "base01" }
"ui.linenr.selected" = { fg = "base04", bg = "base01", modifiers = ["bold"] }
"ui.selection" = { bg = "base02" }
"comment" = { fg = "base03", modifiers = ["italic"] }
"ui.statusline" = { fg = "base04", bg = "base01" }
"ui.cursor" = { fg = "base04", modifiers = ["reversed"] }
"ui.cursor.primary" = { fg = "base05", modifiers = ["reversed"] }
"ui.text" = "base05"
"operator" = "base05"
"ui.text.focus" = "base05"
"variable" = "base08"
"constant.numeric" = "base09"
"constant" = "base09"
"attribute" = "base09"
"type" = "base0A"
"ui.cursor.match" = { fg = "base0A", modifiers = ["underlined"] }
"string"  = "base0B"
"variable.other.member" = "base0B"
"constant.character.escape" = "base0C"
"function" = "base0D"
"constructor" = "base0D"
"special" = "base0D"
"keyword" = "base0E"
"label" = "base0E"
"namespace" = "base0E"
"ui.help" = { fg = "base06", bg = "base01" }

"markup.heading" = "base0D"
"markup.list" = "base08"
"markup.bold" = { fg = "base0A", modifiers = ["bold"] }
"markup.italic" = { fg = "base0E", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "base09", modifiers = ["underlined"] }
"markup.link.text" = "base08"
"markup.quote" = "base0C"
"markup.raw" = "base0B"

"diff.plus" = "base0B"
"diff.delta" = "base09"
"diff.minus" = "base08"

"diagnostic" = { modifiers = ["underlined"] }
"ui.gutter" = { bg = "base01" }
"info" = "base0D"
"hint" = "base03"
"debug" = "base03"
"warning" = "base09"
"error" = "base08"

"ui.bufferline" = { fg = "base04", bg = "base00" }
"ui.bufferline.active" = { fg = "base06", bg = "base01" }

[palette]
base00 = "#341749" # Default Background
base01 = "#4F285B" # Lighter Background (Used for status bars, line number and folding marks)
base02 = "#6A396E" # Selection Background
base03 = "#864980" # Comments, Invisibles, Line Highlighting
base04 = "#A15A92" # Dark Foreground (Used for status bars)
base05 = "#BC6BA4" # Default Foreground, Caret, Delimiters, Operators
base06 = "#D77CB7" # Light Foreground (Not often used)
base07 = "#F28CC9" # Light Background (Not often used)
base08 = "#341749" # Variables, XML Tags, Markup Link Text, Markup Lists, Diff Deleted
base09 = "#65235A" # Integers, Boolean, Constants, XML Attributes, Markup Link Url
base0A = "#CD72C3" # Classes, Markup Bold, Search Text Background
base0B = "#781653" # Strings, Inherited Class, Markup Code, Diff Inserted
base0C = "#9A3875" # Support, Regular Expressions, Escape Characters, Markup Quotes
base0D = "#E682C6" # Functions, Methods, Attribute IDs, Headings
base0E = "#AB53B7" # Keywords, Storage, Selector, Markup Italic, Diff Changed
base0F = "#F28CC9" # Deprecated, Opening/Closing Embedded Language Tags, e.g. <?php ?>
