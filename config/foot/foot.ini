[main]
# font=AnnotationMono:fontfeatures=onum
font=GoogleSansCodenf
dpi-aware=true
resize-by-cells=false
pad=5x5 center

[scrollback]
indicator-position=none

[csd]
size=41
color=15121c
button-color=e7e0ef
button-maximize-color=cfbcff
button-close-color=cfbcff
button-width=40

[cursor]
style=beam

[touch]
long-press-delay=200

[colors-dark]

# Cursor (this is fine, just keep good contrast)
cursor=462349 e8b7e7

# Core
foreground=e7e0ef
background=15121c

# Regular ANSI
regular0=494551   # black
regular1=ffb4ab             # red
regular2=cfbcff           # green (main accent)
regular3=e8b7e7          # yellow-ish
regular4=d7bee4         # blue
regular5=e8b7e7          # magenta fallback
regular6=d7bee4         # cyan fallback
regular7=e7e0ef        # white

# Bright ANSI
bright0=948e9c
bright1=93000a
bright2=5400cc
bright3=5f3961
bright4=523f5f
bright5=5f3961
bright6=523f5f
bright7=e7e0ef
